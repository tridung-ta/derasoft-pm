<form method="post"><input type="hidden" name="op" value="pmprojects"><input type="hidden" name="action" value="project_save"><input type="hidden" name="project_id" value="{$formProject.id|default:0}"><input type="hidden" name="csrf_token" value="{$csrfToken|escape}">
<div class="grid"><label>Mã dự án<input name="code" value="{$formProject.code|default:''|escape}" required minlength="2" maxlength="50"></label><label>Tên dự án<input name="name" value="{$formProject.name|default:''|escape}" required maxlength="150"></label>
{if $isAdmin}<label>Người phụ trách<select name="manager_id" required>{foreach from=$managers item=u}<option value="{$u.id}"{if $formProject.manager_id|default:0 eq $u.id} selected{/if}>{$u.fullname|escape}</option>{/foreach}</select></label>{else}<input type="hidden" name="manager_id" value="{$actorId}">{/if}
<label>Khách hàng (tùy chọn)<input name="client_name" maxlength="150" value="{$formProject.client_name|default:''|escape}"></label><label>Trạng thái<select name="status">{foreach from=$projectStatuses key=s item=label}<option value="{$s|escape}"{if $formProject.status|default:'planned' eq $s} selected{/if}>{$label|escape}</option>{/foreach}</select></label>
<label>Từ ngày<input name="start_date" type="date" value="{$formProject.start_date|default:''|escape}"></label><label>Đến ngày<input name="end_date" type="date" value="{$formProject.end_date|default:''|escape}"></label><label>Ngân sách VND<input name="budget" type="number" min="0" max="9999999999999.99" step="0.01" value="{$formProject.budget|default:'0'|escape}" required></label></div>
<label>Mô tả<textarea name="description" maxlength="10000">{$formProject.description|default:''|escape}</textarea></label><button>Lưu dự án</button></form>
