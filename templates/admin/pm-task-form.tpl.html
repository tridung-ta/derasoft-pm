<form method="post"><input type="hidden" name="op" value="pmprojects"><input type="hidden" name="action" value="task_save"><input type="hidden" name="project_id" value="{$project.id}"><input type="hidden" name="task_id" value="{$formTask.id|default:0}"><input type="hidden" name="csrf_token" value="{$csrfToken|escape}">
<label>Tên công việc<input class="form-control" name="name" value="{$formTask.name|default:''|escape}" required maxlength="150"></label><label>Mô tả<textarea class="form-control" name="description" maxlength="10000">{$formTask.description|default:''|escape}</textarea></label>
<label>Người được giao<select class="form-select" name="assignee_id"><option value="">Chưa giao</option>{foreach from=$members item=m}{if $m.user_status eq 1}<option value="{$m.user_id}"{if $formTask.assignee_id|default:0 eq $m.user_id} selected{/if}>{$m.fullname|escape}</option>{/if}{/foreach}</select></label>
<label>Trạng thái<select class="form-select" name="status">{foreach from=$taskStatuses key=s item=label}<option value="{$s|escape}"{if $formTask.status|default:'todo' eq $s} selected{/if}>{$label|escape}</option>{/foreach}</select></label>
<label>Ưu tiên<select class="form-select" name="priority"><option value="low"{if $formTask.priority|default:'normal' eq 'low'} selected{/if}>Thấp</option><option value="normal"{if $formTask.priority|default:'normal' eq 'normal'} selected{/if}>Bình thường</option><option value="high"{if $formTask.priority|default:'normal' eq 'high'} selected{/if}>Cao</option></select></label>
<label>Giờ dự kiến<input class="form-control" name="estimated_hours" type="number" min="0" max="999999.99" step="0.01" value="{$formTask.estimated_hours|default:'0'|escape}" required></label><label>Ngày bắt đầu<input class="form-control" name="start_date" type="date" value="{$formTask.start_date|default:''|escape}"></label><label>Hạn hoàn thành<input class="form-control" name="due_date" type="date" value="{$formTask.due_date|default:''|escape}"></label><button class="btn">Lưu công việc</button></form>
